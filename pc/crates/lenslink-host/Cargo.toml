[package]
name = "lenslink-host"
description = "LensLink Windows host"
version.workspace = true
edition.workspace = true
license.workspace = true

# `lenslink-host`: the command line tool (src/main.rs). `LensLink`: the tray app with the window.
[[bin]]
name = "LensLink"
path = "src/app.rs"

[build-dependencies]
windows = { version = "0.62.2", features = ["Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D_Fxc"] }

[dependencies]
lenslink-protocol = { path = "../lenslink-protocol" }
lenslink-vcam = { path = "../lenslink-vcam" }
serde_json = "1"
windows-numerics = "0.3"
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Media_MediaFoundation",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
